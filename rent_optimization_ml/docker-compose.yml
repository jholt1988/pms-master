

services:
  ml-service:
    build: .
    container_name: rent-optimization-ml
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://pms:pms@postgres:5432/pms
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - pms-internal

  postgres:
    image: postgres:15-alpine
    container_name: property-db
    environment:
      - POSTGRES_USER=pms
      - POSTGRES_PASSWORD=pms
      - POSTGRES_DB=pms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pms-internal

networks:
  pms-internal:
    driver: bridge

volumes:
  postgres-data:
