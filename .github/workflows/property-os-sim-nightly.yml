name: 'Property OS - Simulation (Nightly)'

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  simulation-nightly-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter tenant_portal_backend build

      - name: Start backend service (in background)
        run: |
          pnpm --filter tenant_portal_backend start &
          sleep 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Simulation Harness (Full)
        run: |
          ./scripts/pms/run-property-os-sim.sh http://localhost:3000/api/v1/property-os/v16/analyze 2000

      - name: Upload Simulation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-nightly-run-${{ github.run_id }}
          path: reports/sim/property-os-v1.6/
