name: Backend Verify Integration

on:
  push:
    branches: [main, develop]
    paths:
      - 'tenant_portal_backend/**'
      - '.github/workflows/backend-verify-integration.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tenant_portal_backend/**'
      - '.github/workflows/backend-verify-integration.yml'

jobs:
  verify-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: tenant_portal_backend

    env: 
      DATABASE_URL: postgresql://pms:pms@localhost:5432/pms?schema=public 
      DIRECT_URL: postgresql://pms:pms@localhost:5432/pms?schema=public 
      REDIS_HOST: redis 
      REDIS_PORT: 6379 
      JWT_SECRET: test-secret-key-for-ci 
      NODE_ENV: test 
      VERIFY_ADMIN_USER: admin 
      VERIFY_ADMIN_PASS: 'Admin123!@#' 
      VERIFY_TENANT_USER: tenant 
      VERIFY_TENANT_PASS: 'Tenant123!@#'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to accept connections..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U pms >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            echo "Postgres not ready yet ($i/30), sleeping 2s"
            sleep 2
          done

      - name: Apply Prisma migrations (CI)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -e
          echo "Running prisma migrate deploy..."
          pnpm exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -e
          echo "Generating Prisma client..."
          pnpm exec prisma generate --schema=./prisma/schema.prisma

      - name: Inspect / fix Lease table
        env:
          PGPASSWORD: pms
        run: |
          echo "Describe Lease (case-sensitive and lowercase variants)…"
          psql -h localhost -U pms -d pms -c '\d "Lease"' || true
          psql -h localhost -U pms -d pms -c '\d lease' || true

          echo "Ensure expected columns exist; add if missing"
          # Adjust SQL types to match your Prisma schema if necessary
          psql -h localhost -U pms -d pms -c 'ALTER TABLE "Lease" ADD COLUMN IF NOT EXISTS "rentAmount" numeric;'
          psql -h localhost -U pms -d pms -c 'ALTER TABLE "Lease" ADD COLUMN IF NOT EXISTS "rentAmountCents" integer;'
          echo "Lease table after fix:"
          psql -h localhost -U pms -d pms -c '\d "Lease"' || true

      - name: Seed robust inspection demo
        env: 
          VERIFY_ADMIN_USER: ${{ env.VERIFY_ADMIN_USER }} 
          VERIFY_ADMIN_PASS: ${{ env.VERIFY_ADMIN_PASS }} 
          VERIFY_TENANT_USER: ${{ env.VERIFY_TENANT_USER }} 
          VERIFY_TENANT_PASS: ${{ env.VERIFY_TENANT_PASS }}
        run: pnpm run seed:inspection-demo:robust

      - name: Start backend
        run: |
          pnpm run dev > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/auth/password-policy || true)
            if [ "$code" = "200" ]; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start"
          cat /tmp/backend.log
          exit 1

      - name: Verify integration flow
        env: 
          API_BASE_URL: http://127.0.0.1:3001/api 
          VERIFY_ADMIN_USER: admin 
          VERIFY_ADMIN_PASS: 'Admin123!@#' 
          VERIFY_TENANT_USER: tenant 
          VERIFY_TENANT_PASS: 'Tenant123!@#'
        run: pnpm run verify:integration
