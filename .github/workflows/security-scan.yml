name: Security Scan

# Secret scanning + large-file guard. Added as part of the 2026-06 security review.
# Weekly schedule stays. Checkout is the current tree only: a full-history
# scan still fails on old commits that contained secrets. Do not restore those
# commits to quiet the scanner. New commits are covered by the gitleaks pre-commit hook.
on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # current tree only; full history fails on old secret commits
      - name: Run gitleaks
        # Current-tree scan. gitleaks-action's git range needs parent commits
        # (fetch-depth 1 exits 1) and the pulls API (PR runs 403). A full-history
        # scan still fails on old secret commits. Do not restore those commits.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 2

  large-files:
    name: Reject files larger than 5 MB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for oversized tracked files
        run: |
          # Fail the build if any tracked file exceeds 5 MB. Use Git LFS for
          # legitimately large assets, or remove accidental commits.
          MAX=$((5 * 1024 * 1024))
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$MAX" ]; then
              printf '::error file=%s::%s is %d bytes (>5 MB). Use Git LFS or remove it.\n' "$f" "$f" "$size"
              fail=1
            fi
          done < <(git ls-files)
          if [ "$fail" -ne 0 ]; then
            echo "Oversized files detected. See annotations above."
            exit 1
          fi
          echo "No tracked file exceeds 5 MB."
