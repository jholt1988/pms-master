name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_backend/**'
      - 'packages/mil-client/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_backend/**'
      - 'packages/mil-client/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub

      - name: Generate Prisma Client
        run: npm run prebuild
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub

      - name: Generate Prisma Client for tenant_portal_backend
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
        run: pnpm exec prisma generate

      - name: Lint backend
        working-directory: ./tenant_portal_backend
        run: pnpm exec eslint 'src/**/*.ts'

      - name: Type check
        working-directory: ./tenant_portal_backend
        run: pnpm exec tsc --noEmit

  integration-webhook-tests:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: property_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test

      - name: Generate Prisma Client
        run: npm run prebuild
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test

      - name: Generate Prisma Client for tenant_portal_backend
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm exec prisma generate

      - name: Run targeted webhook integration specs
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
          DISABLE_STRIPE: "true"
          ALLOW_DISABLED_STRIPE_IN_PRODUCTION: "true"
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          QUICKBOOKS_CLIENT_ID: qb_ci_client
          QUICKBOOKS_CLIENT_SECRET: qb_ci_secret
          QUICKBOOKS_REDIRECT_URI: http://localhost:3001/api/quickbooks/callback
          QUICKBOOKS_WEBHOOK_VERIFIER: qb_ci_verifier
          QUICKBOOKS_WEBHOOK_REQUIRE_SIGNATURE: "false"
          ESIGN_PROVIDER: DOCUSIGN
          ESIGN_PROVIDER_BASE_URL: https://demo.docusign.net/restapi/v2.1
          ESIGN_PROVIDER_ACCOUNT_ID: 00000000-0000-0000-0000-000000000000
          ESIGN_PROVIDER_API_KEY: test-esign-token
          ESIGN_WEBHOOK_SECRET: ci-esign-secret
          ESIGN_WEBHOOK_REQUIRE_SIGNATURE: "false"
        run: >
          pnpm exec jest
          src/payments/stripe-webhook.controller.spec.ts
          src/payments/stripe.service.spec.ts
          src/esignature/esignature-webhook.controller.spec.ts
          src/esignature/esignature-webhook-signature.spec.ts
          --runInBand

  test:
    runs-on: ubuntu-latest
    needs: [lint, integration-webhook-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: property_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test

      - name: Generate Prisma Client
        run: npm run prebuild
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
      - name: Generate Prisma Client for tenant_portal_backend
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm exec prisma generate
      - name: Run Prisma migrations
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm exec prisma migrate deploy

      - name: Run unit tests
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
          DISABLE_STRIPE: "true"
          ALLOW_DISABLED_STRIPE_IN_PRODUCTION: "true"
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          QUICKBOOKS_CLIENT_ID: qb_ci_client
          QUICKBOOKS_CLIENT_SECRET: qb_ci_secret
          QUICKBOOKS_REDIRECT_URI: http://localhost:3001/api/quickbooks/callback
          QUICKBOOKS_WEBHOOK_VERIFIER: qb_ci_verifier
          QUICKBOOKS_WEBHOOK_REQUIRE_SIGNATURE: "false"
          ESIGN_PROVIDER: DOCUSIGN
          ESIGN_PROVIDER_BASE_URL: https://demo.docusign.net/restapi/v2.1
          ESIGN_PROVIDER_ACCOUNT_ID: 00000000-0000-0000-0000-000000000000
          ESIGN_PROVIDER_API_KEY: test-esign-token
          ESIGN_WEBHOOK_SECRET: ci-esign-secret
          ESIGN_WEBHOOK_REQUIRE_SIGNATURE: "false"
        run: pnpm test -- --coverage --coverageReporters=text --coverageReporters=lcov --runInBand --detectOpenHandles

      - name: Run E2E tests
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
          DISABLE_STRIPE: "true"
          ALLOW_DISABLED_STRIPE_IN_PRODUCTION: "true"
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          QUICKBOOKS_CLIENT_ID: qb_ci_client
          QUICKBOOKS_CLIENT_SECRET: qb_ci_secret
          QUICKBOOKS_REDIRECT_URI: http://localhost:3001/api/quickbooks/callback
          QUICKBOOKS_WEBHOOK_VERIFIER: qb_ci_verifier
          QUICKBOOKS_WEBHOOK_REQUIRE_SIGNATURE: "false"
          ESIGN_PROVIDER: DOCUSIGN
          ESIGN_PROVIDER_BASE_URL: https://demo.docusign.net/restapi/v2.1
          ESIGN_PROVIDER_ACCOUNT_ID: 00000000-0000-0000-0000-000000000000
          ESIGN_PROVIDER_API_KEY: test-esign-token
          ESIGN_WEBHOOK_SECRET: ci-esign-secret
          ESIGN_WEBHOOK_REQUIRE_SIGNATURE: "false"
        run: pnpm run test:e2e

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tenant_portal_backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub

      - name: Generate Prisma Client
        run: npm run prebuild
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub

      - name: Generate Prisma Client for tenant_portal_backend
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
        run: pnpm exec prisma generate

      - name: Build backend
        working-directory: ./tenant_portal_backend
        run: pnpm build

      - name: Verify build output
        working-directory: ./tenant_portal_backend
        run: test -d dist && echo "Build output verified"

  schema-drift:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: property_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test

      - name: Apply migrations to a clean database
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm exec prisma migrate deploy

      - name: Fail if schema.prisma has drifted from migrations
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm run db:check-drift
