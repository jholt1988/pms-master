name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_backend/**'
      - 'packages/mil-client/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_backend/**'
      - 'packages/mil-client/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
       

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npm run prebuild

      - name: Lint backend
        working-directory: ./tenant_portal_backend
        run: pnpm exec eslint 'src/**/*.ts' 

      - name: Type check
        working-directory: ./tenant_portal_backend
        run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: u
          POSTGRES_PASSWORD: p
          POSTGRES_DB: property_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
     

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Generate Prisma Client
        run: npm run prebuild
        
      - name: Generate Prisma Client
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm exec prisma generate

      - name: Run Prisma migrations
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
        run: pnpm exec prisma migrate deploy

      - name: Run unit tests
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Run E2E tests
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/property_management_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm run test:e2e

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tenant_portal_backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npm run prebuild

      - name: Generate Prisma Client
        working-directory: ./tenant_portal_backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/stub
        run: pnpm exec prisma generate

      - name: Build backend
        working-directory: ./tenant_portal_backend
        run: pnpm build

      - name: Verify build output
        working-directory: ./tenant_portal_backend
        run: test -d dist && echo "Build output verified"
