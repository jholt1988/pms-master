name: Mobile CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # tenant_portal_mobile has no package-lock.json. The workspace lockfile
      # is pnpm-lock.yaml, so npm ci cannot install this app.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: ./tenant_portal_mobile
        run: |
          if [ -f "tsconfig.json" ]; then
            pnpm exec tsc --noEmit
          else
            echo "No tsconfig.json found, skipping type check"
          fi

      - name: Lint check
        working-directory: ./tenant_portal_mobile
        run: |
          if pnpm run lint --if-present; then
            echo "Lint check passed"
          else
            echo "No lint script found, skipping"
          fi

      - name: Run tests
        working-directory: ./tenant_portal_mobile
        run: |
          if pnpm test --if-present; then
            echo "Tests passed"
          else
            echo "No test script found, skipping"
          fi

