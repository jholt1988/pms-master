name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_app/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'tenant_portal_app/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # tenant_portal_app has no package-lock.json. The workspace lockfile is
      # pnpm-lock.yaml, so npm ci cannot install this app.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter tenant_portal_app exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter tenant_portal_app test -- --run

      - name: Build check
        run: pnpm --filter tenant_portal_app build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: tenant_portal_app/dist
          retention-days: 1
