name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          echo "version=staging-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tenant_portal_backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tenant_portal_app/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_API_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # Pull latest images
            docker pull ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}

            # Tag as current
            docker tag ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} pms-backend:current
            docker tag ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} pms-frontend:current

            # Save previous image tags for rollback
            docker inspect pms-backend:current --format='{{index .RepoDigests 0}}' > .previous-backend-digest 2>/dev/null || true
            docker inspect pms-frontend:current --format='{{index .RepoDigests 0}}' > .previous-frontend-digest 2>/dev/null || true

            # Run migrations and restart
            docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
            sleep 10

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          echo "Running smoke tests against ${STAGING_URL}"

          # Health check with retries
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check failed with status $HTTP_STATUS (attempt $i/5)"
            sleep 10
          done
          echo "Smoke tests failed after 5 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deployment failed for commit ${{ github.sha }}"
