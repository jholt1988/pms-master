# Production/staging override for image-based deploys.
services:
  postgres:
    ports: !reset []
    mem_limit: 512m
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports: !reset []
    mem_limit: 256m
    logging: *default-logging

  rabbitmq:
    ports: !reset []
    mem_limit: 512m
    logging: *default-logging

  mil:
    ports: !reset []
    mem_limit: 512m
    logging: *default-logging

  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:-ghcr.io/jholt1988/pms-master/backend}:${IMAGE_TAG:-latest}
    pull_policy: always
    ports: !reset []
    mem_limit: 1g
    logging: *default-logging

  backend-migrate:
    build: !reset null
    image: ${BACKEND_IMAGE:-ghcr.io/jholt1988/pms-master/backend}:${IMAGE_TAG:-latest}
    pull_policy: always
    logging: *default-logging

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE:-ghcr.io/jholt1988/pms-master/frontend}:${IMAGE_TAG:-latest}
    pull_policy: always
    mem_limit: 256m
    logging: *default-logging

  workflow-engine:
    ports: !reset []
    mem_limit: 512m
    logging: *default-logging

  ml-service:
    mem_limit: 2g
    logging: *default-logging
