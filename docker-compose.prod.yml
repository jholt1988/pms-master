# Production override for pms-master
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  rabbitmq:
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  mil:
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  backend:
    command: >
      sh -c "npx prisma migrate deploy --schema=./prisma/schema.prisma &&
      node dist/tenant_portal_backend/src/index.js"
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  frontend:
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  workflow-engine:
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  ml-service:
    deploy:
      resources:
        limits:
          memory: 2G
    logging: *default-logging
