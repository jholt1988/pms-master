

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    
  mil:
    build:
      context: .
      dockerfile: security/mil/Dockerfile
    container_name: pms-mil
    restart: unless-stopped
    env_file:
      - ops/.env.dev
    environment:
      NODE_ENV: production
      PORT: 3010
    ports:
      - "3010:3010"
    networks:
    - default

  backend:
    build:
      context: .
      dockerfile: tenant_portal_backend/Dockerfile
      target: runner
    container_name: pms-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://pms:pms@postgres:5432/pms?schema=public"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,http://localhost:3003,http://localhost:8000,http://localhost:3002
      JWT_SECRET: change-me-in-prod
      MIL_WRAPPER_ENABLED: "True"
      MIL_ENCRYPT_AT_REST_ENABLED: "false"
      MIL_AUDIT_PERSIST_ENABLED: "false"
      WORKFLOW_ENGINE_URL: "http://workflow-engine:3003"
      ML_SERVICE_URL: "http://ml-service:8000"
    ports:
      - "3001:3001"
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate && node dist/tenant_portal_backend/src/index.js"

  workflow-engine:
    image: node:20-alpine
    container_name: pms-workflow-engine
    restart: unless-stopped
    profiles: ["property-os"]
    working_dir: /workspace
    environment:
      PORT: 3003
      DATABASE_URL: "postgresql://pms:pms@postgres:5432/pms?schema=public"
    depends_on:
      - postgres
    volumes:
      - ./:/workspace
    ports:
      - "3003:3003"
    command: >
      sh -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @propertyos/workflow-engine dev"

  ml-service:
    build:
      context: ./rent_optimization_ml
      dockerfile: Dockerfile
    container_name: pms-rent-optimization-ml
    restart: unless-stopped
    profiles: ["ml"]
    environment:
      API_PORT: 8000
      API_HOST: 0.0.0.0
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: "postgresql://pms:pms@postgres:5432/pms"
    ports:
      - "8000:8000"
    volumes:
      - ./rent_optimization_ml/models:/app/models
      - ./rent_optimization_ml/logs:/app/logs
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: tenant_portal_app/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: pms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
