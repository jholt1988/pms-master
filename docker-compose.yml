services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pms
      RABBITMQ_DEFAULT_PASS: pms
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mil:
    build:
      context: .
      dockerfile: security/mil/Dockerfile
    container_name: pms-mil
    restart: unless-stopped
    env_file:
      - ops/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3010
    ports:
      - "3010:3010"

  backend:
    build:
      context: .
      dockerfile: tenant_portal_backend/Dockerfile
      target: runner
    container_name: pms-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ops/.env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:3003,http://localhost:8000,http://localhost:3002}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      MIL_SERVICE_URL: ${MIL_SERVICE_URL:-http://mil:3010}
      MIL_WRAPPER_ENABLED: ${MIL_WRAPPER_ENABLED:-true}
      MIL_ENCRYPT_AT_REST_ENABLED: ${MIL_ENCRYPT_AT_REST_ENABLED:-false}
      MIL_AUDIT_PERSIST_ENABLED: ${MIL_AUDIT_PERSIST_ENABLED:-false}
      WORKFLOW_ENGINE_URL: ${WORKFLOW_ENGINE_URL:-http://workflow-engine:3003}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
    ports:
      - "3001:3001"
    command: >
      sh -c "npx prisma migrate deploy --schema=./prisma/schema.prisma &&
      node dist/tenant_portal_backend/src/index.js"

  workflow-engine:
    build:
      context: .
      dockerfile: services/workflow-engine/Dockerfile
    container_name: pms-workflow-engine
    restart: unless-stopped
    profiles: ["property-os"]
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    ports:
      - "3003:3003"

  ml-service:
    build:
      context: ./rent_optimization_ml
      dockerfile: Dockerfile
    container_name: pms-rent-optimization-ml
    restart: unless-stopped
    profiles: ["ml"]
    environment:
      API_PORT: 8000
      API_HOST: 0.0.0.0
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./rent_optimization_ml/models:/app/models
      - ./rent_optimization_ml/logs:/app/logs
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: tenant_portal_app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: pms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  property-pulse:
    build:
      context: ../property_pulse
      dockerfile: Dockerfile
    container_name: pms-property-pulse
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND_API_ORIGIN=http://backend:3001
      - NEXT_PUBLIC_API_BASE_URL=http://backend:3001/api
    ports:
      - "3002:3000"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pms-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pms-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3100:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

