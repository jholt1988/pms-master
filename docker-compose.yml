services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pms}
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/init-shadow-db.sh:/docker-entrypoint-initdb.d/init-shadow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms} -d ${POSTGRES_DB:-pms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pms-internal

  redis:
    image: redis:7-alpine
    container_name: pms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pms-internal

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pms}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - pms-internal

  mil:
    build:
      context: .
      dockerfile: security/mil/Dockerfile
    container_name: pms-mil
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${MIL_PORT:-3010}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms?schema=public}
    ports:
      - "${MIL_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pms-internal

  backend:
    build:
      context: .
      dockerfile: tenant_portal_backend/Dockerfile
    image: pms-backend:latest
    container_name: pms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms?schema=public}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms_shadow?schema=public}
      DIRECT_URL: ${DIRECT_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://admin.localhost:3000,http://localhost:8080,http://localhost:3003,http://localhost:8000,http://localhost:3002}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see ops/.env.*.example)}
      MIL_SERVICE_URL: ${MIL_SERVICE_URL:-http://mil:3010}
      MIL_WRAPPER_ENABLED: ${MIL_WRAPPER_ENABLED:-true}
      MIL_ENCRYPT_AT_REST_ENABLED: ${MIL_ENCRYPT_AT_REST_ENABLED:-false}
      MIL_AUDIT_PERSIST_ENABLED: ${MIL_AUDIT_PERSIST_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://pms:pms@rabbitmq:5672}
      DISABLE_WORKFLOW_SCHEDULER: ${DISABLE_WORKFLOW_SCHEDULER:-true}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      DISABLE_STRIPE: ${DISABLE_STRIPE:-true}
      ALLOW_DISABLED_STRIPE_IN_PRODUCTION: ${ALLOW_DISABLED_STRIPE_IN_PRODUCTION:-true}
      LIGHTNING_API_KEY: ${LIGHTNING_API_KEY:-mock-key}
      LIGHTNING_MODEL: ${LIGHTNING_MODEL:-lightning-ai/gpt-oss-120b}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_CHATBOT_ENABLED: ${AI_CHATBOT_ENABLED:-true}
      AI_PROPERTY_OPS_ORCHESTRATOR_ENABLED: ${AI_PROPERTY_OPS_ORCHESTRATOR_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health/liveness"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pms-internal

  backend-migrate:
    build:
      context: .
      dockerfile: tenant_portal_backend/Dockerfile
    image: pms-backend
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms?schema=public}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms_shadow?schema=public}
      DIRECT_URL: ${DIRECT_URL:-}
    user: root
    command: sh -c "npx prisma generate && npx prisma migrate deploy --schema=./prisma/schema.prisma"
    restart: "no"
    networks:
      - pms-internal

  workflow-engine:
    build:
      context: .
      dockerfile: services/workflow-engine/Dockerfile
    container_name: pms-workflow-engine
    restart: unless-stopped
    profiles: ["property-os"]
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"
    networks:
      - pms-internal

  ml-service:
    build:
      context: ./rent_optimization_ml
      dockerfile: Dockerfile
    container_name: pms-rent-optimization-ml
    restart: unless-stopped
    profiles: ["ml"]
    environment:
      API_PORT: 8000
      API_HOST: 0.0.0.0
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms?schema=public}
    ports:
      - "8000:8000"
    volumes:
      - ./rent_optimization_ml/models:/app/models
      - ./rent_optimization_ml/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pms-internal

  frontend:
    build:
      context: .
      dockerfile: tenant_portal_app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: pms-frontend
    container_name: pms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - pms-internal

  # property-pulse:
  #   build:
  #     context: ../property_pulse
  #     dockerfile: Dockerfile
  #   container_name: pms-property-pulse
  #   restart: unless-stopped
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   environment:
  #     BACKEND_API_ORIGIN: ${PROPERTY_PULSE_BACKEND_API_ORIGIN:-http://backend:3001}
  #     NEXT_PUBLIC_API_BASE_URL: ${PROPERTY_PULSE_API_BASE_URL:-http://backend:3001/api}
  #   ports:
  #     - "3002:3000"
  #   networks:
  #     - pms-internal

  keyring-os:
    build:
      context: ../keyring-os
      dockerfile: apps/admin/Dockerfile
    image: jholt1988/keyring_os:1.0
    container_name: pms-keyring-os
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_ORIGIN: ${KEYRING_BACKEND_API_ORIGIN:-http://backend:3001}
      NEXT_PUBLIC_API_BASE_URL: ${KEYRING_API_BASE_URL:-http://backend:3001/api}
      API_URL: http://backend:3001
      OPERATOR_API_BASE_URL: http://backend:3001
    ports:
      - "3004:3000"
    networks:
      - pms-internal

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pms-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pms-internal

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pms-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3100:3000"
    depends_on:
      - prometheus
    networks:
      - pms-internal

networks:
  pms-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
