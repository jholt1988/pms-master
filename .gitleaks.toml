# ---- gitleaks config (added during 2026-06 security review) ----
# Uses gitleaks' built-in rules. Add [[rules]] here for project-specific
# secret shapes, or [allowlist] paths for known-safe files.
title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Files that are safe to contain secret-like placeholders"
paths = [
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
  '''(^|/)README\.md$''',
  # curl-auth-header matches the header shape in these guides, not a credential.
  '''docs/guides/rent-notifications-guide\.md$''',
  '''docs/integrations/quickbooks-sandbox-testing-guide\.md$''',
  '''docs/integrations/quickbooks-testing-guide\.md$''',
  '''docs/setup/complete-execution-guide\.md$''',
  '''docs/troubleshooting/ml-service-down-guide\.md$''',
]
